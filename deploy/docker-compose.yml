# ============================================================
# Naspic Docker Compose（MySQL 版）
#
# 用法：
#   ./deploy/build.sh
#   docker compose -f deploy/docker-compose.yml up -d
#
# 重点：
#   1. 宿主机照片目录一律 **只读** 挂载（:ro），容器内绝不修改原图
#   2. 业务数据全部落在 mysql 服务里（不再用 SQLite 文件）
#   3. 首次启动会自动建表；若之前用的是 SQLite，见 docs/ 迁移说明
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: naspic-mysql
    restart: unless-stopped
    command:
      # utf8mb4 才能存 emoji 文件名；排序规则用通用版，Go 驱动最省心
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-naspic_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-naspic}
      MYSQL_USER: ${MYSQL_USER:-naspic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-naspic_2026}
      TZ: Asia/Shanghai
    volumes:
      - ${MYSQL_DATA_DIR:-./mysql/data}:/var/lib/mysql
      # 首次启动自动执行的建库/授权脚本（只在数据卷为空时执行一次）
      - ${MYSQL_INIT_DIR:-./mysql/init}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-naspic_2026}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Redis 只读缓存（可选但推荐）：媒体列表、统计、相册库/相册列表
  # 挂了也无所谓——服务端会自动降级为「不缓存」，不会拖垮相册
  redis:
    image: redis:7-alpine
    container_name: naspic-redis
    restart: unless-stopped
    command:
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
      - --save ""            # 纯缓存，不落盘，重启即空
      - --appendonly no
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  naspic:
    image: naspic:latest
    build:
      context: ..                    # 构建上下文 = 项目根目录
      dockerfile: deploy/Dockerfile
      args:
        VERSION: "1.8.0"
        TAGS: "vips"
    container_name: naspic
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      NASPIC_DATA_DIR: /data
      NASPIC_WEB_ROOT: /web
      NASPIC_LOG_LEVEL: info
      # ---- 数据库：MySQL ----
      NASPIC_DB_DRIVER: mysql
      NASPIC_DB_DSN: "${MYSQL_USER:-naspic}:${MYSQL_PASSWORD:-naspic_2026}@tcp(mysql:3306)/${MYSQL_DATABASE:-naspic}?charset=utf8mb4&parseTime=True&loc=Local"
      # ---- Redis 缓存（连不上会自动降级，不影响使用）----
      NASPIC_REDIS_ENABLED: "true"
      NASPIC_REDIS_ADDR: redis:6379
      NASPIC_REDIS_TTL: "60"
      # NASPIC_TIER: low        # 低配 ARM（≤1GB 内存）显式降档
      # NASPIC_AI: "0"          # 关闭 AI（默认即关闭）
    volumes:
      # 数据目录用环境变量覆盖（默认 ./data），方便放到与代码无关的持久化目录。
      # 千万别把数据卷指向代码目录——重新同步代码会被一起删掉。
      - ${NASPIC_DATA_DIR:-./data}:/data

      # 宿主机已有照片目录 —— 只读挂载，容器内路径与宿主机保持一致
      - ${NASPIC_PHOTOS_DIR:-/photos}:/photos:ro

    # 资源限制（低配 ARM 建议设置）
    # mem_limit: 1g
    # cpus: 1.5

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
