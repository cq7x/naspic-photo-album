# Naspic 私有云相册 配置示例
# 优先级：环境变量 > 配置文件 > 按设备档位自动推导的默认值
# 档位由可用内存自动判定（low ≤1GB / mid 1~4GB / high >4GB），可用 NASPIC_TIER 覆盖

server:
  host: 0.0.0.0
  port: 8080
  mode: release            # debug | release
  data_dir: /data          # 数据库、缓存、临时目录的父目录
  web_root: /web           # 前端静态文件目录（镜像内置）；留空=纯 API 模式
  timezone: Asia/Shanghai  # 库内存 UTC，展示按此转换
  read_timeout: 60
  write_timeout: 300

database:
  # 低配 ARM（树莓派/入门 NAS）强烈建议 sqlite；MySQL 仅在多用户大库场景使用
  driver: sqlite
  dsn: /data/naspic.db
  # driver: mysql
  # dsn: "user:pass@tcp(127.0.0.1:3306)/naspic?charset=utf8mb4&parseTime=True&loc=UTC"
  max_open: 10
  max_idle: 2
  log_level: warn

storage:
  managed_root: /data/managed      # 平台托管存储（APP 上传落盘处）
  cache_root: /data/cache          # 缩略图缓存，必须与原图分离
  temp_root: /data/tmp             # 分片上传暂存

scan:
  workers: 2                       # ARM 低配设 1
  queue_size: 512
  rate_per_sec: 5                  # 令牌桶，防止批量入库打满 IO
  batch_size: 300
  poll_interval: 300               # 轮询周期（秒）
  enable_watch: true               # 是否启用 inotify（失败自动降级轮询）
  cpu_guard: true                  # 负载超阈值自动退避
  cpu_limit: 150                   # 百分比；150 表示 1.5 × CPU 核数

thumb:
  enabled: true
  backend: vips                    # vips（推荐）| go（纯 Go 降级）
  workers: 2                       # ARM 低配设 1
  queue_size: 256
  sizes: "256,512,1080"
  quality: 82
  format: webp

ai:
  enabled: false                   # 低配 ARM 建议关闭
  model_dir: /data/models
  workers: 1
  max_memory: 512                  # MB
  cpu_weight: 20
  detect_face: true
  scene_model: mobilenet_v3_small

sync:
  chunk_size_wifi: 4194304         # 4MB
  chunk_size_mobile: 1048576       # 1MB
  session_ttl_hours: 168           # 分片会话保留 7 天，支持断点续传
  max_retry: 5
  hash_full_max_bytes: 20971520    # <20MB 全量哈希，超过走头尾快速哈希

log:
  level: info
  file: ""                         # 空=仅输出到 stdout（容器推荐）
  max_size_mb: 32
  max_backups: 5
